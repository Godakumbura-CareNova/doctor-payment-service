name: Doctor Payment CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test Doctor Payment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore DoctorPayment.sln

      - name: Build
        run: dotnet build DoctorPayment.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DoctorPayment.sln --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t carenova-doctor-payment:ci-test .
